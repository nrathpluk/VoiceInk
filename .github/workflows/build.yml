name: Build Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create Releases

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Regenerate icon
        run: python make_icon.py

      - name: Build .exe
        # Use the spec file directly - build.bat tries to bootstrap UPX which is
        # not always available in CI. PyInstaller alone produces the same .exe;
        # UPX compression is optional and skipped here for reliability.
        run: pyinstaller ThaiVoice.spec --noconfirm

      - name: Verify .exe exists
        run: |
          if (-not (Test-Path "dist/ThaiVoice.exe")) {
            Write-Error "dist/ThaiVoice.exe not found after build"
            exit 1
          }
          Get-Item "dist/ThaiVoice.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiVoice-${{ github.ref_name }}
          path: dist/ThaiVoice.exe
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThaiVoice.exe
          draft: true
          generate_release_notes: true
